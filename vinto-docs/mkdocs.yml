site_name: Documentación - Taller de Programación
site_author: "Seyla Esther Coimbra Mita"
site_description: "Documentación técnica del Sistema de Reportes de Incidentes Ambientales (Vinto)"

# Servidor de desarrollo (mismo puerto que indica la guía: 8000)
dev_addr: '127.0.0.1:8000'

theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: indigo
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight

nav:
  - Inicio: index.md
  - Instalación y Requisitos: instalacion.md
  - Arquitectura del Sistema: arquitectura.md
  - Guía de Uso: guia-uso.md
  - API / Módulos: api.md
  - Diagramas de Clases: diagramas-clases.md
  - Pruebas: pruebas.md
  - Conclusiones: conclusiones.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
